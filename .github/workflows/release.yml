name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: python -m pip install -r requirements-tested.txt pyinstaller==6.22.3
      - name: Test and build
        shell: pwsh
        run: ./build.ps1
      - name: Publish version from version.py
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read version' }
          gh release create "v$version" releases/V26Macro_Windows.zip releases/V26Macro_Windows.sha256 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "V26Macro v$version" --notes "Windows release. Extract the ZIP and run V26Macro.exe. Existing users can install this version from the app."
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; check whether this version already exists' }
